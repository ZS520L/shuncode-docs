<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>火柴人大战 · STICK DUEL</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #080d19;
  }
  body {
    display: grid;
    place-items: center;
  }
  svg {
    display: block;
    width: 100%;
    height: 100%;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .limb {
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .mono {
    font-family: Consolas, monospace;
    letter-spacing: 3px;

<body>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1000 680"
     role="img" aria-labelledby="title description">
  <title id="title">火柴人大战</title>
  <desc id="description">
    青色与粉色火柴人在霓虹竞技场交战，
    循环展示冲刺、直拳、后仰闪避、反击踢腿与双拳对撞。

  <defs>
    <linearGradient id="background" x2="0" y2="1">
      <stop stop-color="#101a30"/>
      <stop offset="1" stop-color="#070b15"/>
    </linearGradient>

    <radialGradient id="ambient">
      <stop stop-color="#244b76" stop-opacity=".45"/>
      <stop offset="1" stop-color="#101728" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="floor" x2="0" y2="1">
      <stop stop-color="#17273e"/>
      <stop offset="1" stop-color="#090e19"/>
    </linearGradient>

    <linearGradient id="divider">
      <stop stop-color="#53edff" stop-opacity="0"/>
      <stop offset=".3" stop-color="#53edff"/>
      <stop offset=".7" stop-color="#ff5b98"/>
      <stop offset="1" stop-color="#ff5b98" stop-opacity="0"/>
    </linearGradient>

    <pattern id="dots" width="28" height="28"
             patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#b9d8ff" opacity=".07"/>
    </pattern>

    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="soft">
      <feGaussianBlur stdDeviation="8"/>
    </filter>

    <!-- 可复用的撞击星芒 -->
    <g id="spark" fill="none" stroke-linecap="round">
      <path d="M-44 0H-20M20 0H44M0-44V-20M0 20V44"
            stroke="currentColor" stroke-width="4"/>
      <path d="M-30-30L-14-14M14 14L30 30
               M30-30L14-14M-14 14L-30 30"
            stroke="#fff5d7" stroke-width="3"/>
      <path d="M0-17L5-5L17 0L5 5L0 17L-5 5L-17 0L-5-5Z"
            fill="#ffffff" stroke="none"/>
    </g>

    <!-- 地面烟尘 -->
    <g id="dust" fill="none" stroke="#a0b8cd"
       stroke-width="3" stroke-linecap="round">
      <path d="M-40 0Q-44-15-29-13Q-27-31-12-20
               Q0-35 12-18Q30-24 32-8Q47-8 45 0"/>
      <path d="M-58 3H-43M42 5H61"/>
